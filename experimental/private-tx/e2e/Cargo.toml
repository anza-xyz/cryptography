# Standalone workspace, deliberately not a member of the repository root
# workspace: Mollusk pulls in the SVM runtime, which would otherwise bloat the
# root lockfile and every build in the repository.
[workspace]

[package]
name = "private-tx-e2e"
description = "End-to-end checks of the private-tx gnark circuits against the Solana Groth16 verifier program"
version = "0.0.0"
edition = "2021"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/anza-xyz/cryptography"
license = "Apache-2.0"
publish = false

[dependencies]
# Verifier program library and gnark/arkworks format bridge, pinned to one
# revision so the fixtures and the on-chain format move together. Keep in
# sync with `VERIFIER_REV` in ../Makefile.
solana-groth16-verify = { git = "https://github.com/solana-program/groth16-verifier-program", rev = "8bd06b4fb07f636c1872993a99f1a296b23b69fa", default-features = false, features = ["verify", "instruction"] }
groth16-convert = { git = "https://github.com/solana-program/groth16-verifier-program", rev = "8bd06b4fb07f636c1872993a99f1a296b23b69fa" }

# The Poseidon reference the Solana syscall (and syscall/solana-bn254) are
# generated from; the circuit gadget must agree with it.
light-poseidon = "0.4.0"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"

hex = "0.4.2"

[dev-dependencies]
mollusk-svm = "0.13.1"
solana-account = "3.4.0"
solana-address = "2.7.0"
solana-instruction = "3.3.0"
solana-program-error = "3.0.1"

[profile.dev]
opt-level = 2
