[package]
name = "solana-bn254-backend"
description = "BN254 and Poseidon for Solana"
version = "0.1.0"
edition = "2024"
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
exclude = ["scripts/*"]

[features]

[dependencies]

# Selects the ADX/BMI2 and AVX-512 IFMA kernels at run time.
[target.'cfg(target_arch = "x86_64")'.dependencies]
cpufeatures = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-bn254 = { workspace = true }
light-poseidon = { workspace = true }
num-bigint = { workspace = true }

[[bench]]
name = "poseidon_bench"
harness = false

[[bench]]
name = "curve_bench"
harness = false

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(bn254_disable, values("adx", "ifma"))']
