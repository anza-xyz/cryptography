name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  rust-checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  feature-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install cargo-hack
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-hack

      - name: Check
        run: |
          cargo hack check --each-feature --all-targets

      # The Cargo feature can be enabled without the matching target features;
      # in that configuration the target-specific dependency and API are
      # omitted while the rest of the crate remains usable.
      - name: Test avx512 fallback
        run: |
          cargo test -p solana-ed25519 --features avx512 --lib

  # Enable both gates for the optimized implementation: the `avx512` Cargo
  # feature exposes the verifier, while these target features select its IFMA
  # implementation and make LLVM generate AVX-512 code. GitHub runners do not
  # guarantee AVX-512 IFMA, so the gated tests execute only when the host
  # reports every required CPU feature.
  avx512-build:
    name: avx512 (compile, lint + native tests when supported)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+avx512f,+avx512bw,+avx512dq,+avx512ifma
      # Every cargo invocation below MUST pass this. `RUSTFLAGS` without an
      # explicit `--target` is also applied to host artifacts — build scripts
      # and proc macros — which cargo then *executes* during the build. The
      # runner may have no AVX-512, so the compiler's own auto-vectorization of,
      # say, `proc-macro2`'s build script can kill it with SIGILL before any of
      # our code is even compiled. Passing `--target`, even when it equals the
      # host triple, makes cargo build host artifacts without `RUSTFLAGS`.
      AVX512_TARGET: x86_64-unknown-linux-gnu
      # Fail safely if a step that is only meant to compile ever tries to run a
      # target binary on a host without AVX-512. Cargo does not use the target
      # runner for host build scripts or proc macros, so this does not cover the
      # SIGILL above. The one step that legitimately runs target binaries opts
      # out explicitly with `env -u`.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /bin/false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Detect AVX-512 IFMA support
        id: avx512-host
        run: |
          supported=true
          for feature in avx512f avx512bw avx512dq avx512ifma
          do
            if ! grep --quiet --word-regexp "${feature}" /proc/cpuinfo
            then
              supported=false
            fi
          done
          echo "supported=${supported}" >> "${GITHUB_OUTPUT}"
          if [ "${supported}" = true ]
          then
            echo "Host supports AVX-512F/BW/DQ/IFMA; native tests will run."
          else
            echo "::notice::Host lacks AVX-512 IFMA; native tests are skipped."
          fi

      # These target features change codegen for the whole crate, including the
      # pre-existing curve backend that the steps below only ever compile, so
      # run the entire library suite rather than just the AVX-512 module's own
      # tests.
      - name: Test natively with AVX-512 target features
        if: steps.avx512-host.outputs.supported == 'true'
        run: |
          env -u CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER \
            cargo test -p solana-ed25519 --target "${AVX512_TARGET}" \
              --features avx512 --lib

      # `--all-targets` also catches breakage in eligible cfg-gated test and
      # bench code.
      #
      # No `-D warnings` yet: enabling these target features also changes which
      # cfg branches of the pre-existing AVX2/packed_simd code compile, and that
      # configuration has never been linted — it is already warning-dirty on
      # upstream master, independently of the avx512 code. Clean that up in its
      # own change, then add `-- -D warnings` here.
      - name: Lint
        run: |
          cargo clippy -p solana-ed25519 --target "$AVX512_TARGET" \
            --features avx512 --all-targets

      # Ensure the AVX-512 target remains independent of unrelated default
      # features, especially `precomputed-tables`.
      - name: Build minimal feature set
        run: |
          cargo build -p solana-ed25519 --target "$AVX512_TARGET" \
            --no-default-features --features avx512 --lib

      # The AVX-512 target features must also compile when the curve backend is
      # forced to serial; the two selections are independent.
      - name: Build with serial curve backend
        env:
          RUSTFLAGS: -C target-feature=+avx512f,+avx512bw,+avx512dq,+avx512ifma --cfg curve25519_backend="serial"
        run: |
          cargo build -p solana-ed25519 --target "$AVX512_TARGET" \
            --features avx512 --all-targets
