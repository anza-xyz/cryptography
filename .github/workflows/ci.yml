name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  rust-checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  feature-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install cargo-hack
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-hack

      - name: Check
        run: |
          cargo hack check --each-feature --all-targets

      # The Cargo feature must also build without matching target features.
      - name: Test avx512 fallback
        run: |
          cargo test -p solana-ed25519 --features avx512 --lib

  # Compile the feature and IFMA target configuration. Execute it only on
  # runners that report every required CPU feature.
  avx512-build:
    name: avx512 (compile, lint + native tests when supported)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+avx512f,+avx512bw,+avx512dq,+avx512ifma
      # `--target` keeps AVX-512 RUSTFLAGS off executable host artifacts such as
      # build scripts and proc macros.
      AVX512_TARGET: x86_64-unknown-linux-gnu
      # Prevent compile-only steps from running AVX-512 target binaries. The
      # native test step unsets this runner.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /bin/false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Detect AVX-512 IFMA support
        id: avx512-host
        run: |
          supported=true
          for feature in avx512f avx512bw avx512dq avx512ifma
          do
            if ! grep --quiet --word-regexp "${feature}" /proc/cpuinfo
            then
              supported=false
            fi
          done
          echo "supported=${supported}" >> "${GITHUB_OUTPUT}"
          if [ "${supported}" = true ]
          then
            echo "Host supports AVX-512F/BW/DQ/IFMA; native tests will run."
            echo "**AVX-512 IFMA available** on this runner; the native test" \
              "suite ran." >> "${GITHUB_STEP_SUMMARY}"
          else
            # Make reduced test coverage visible in the checks UI.
            echo "::warning::Host lacks AVX-512 IFMA; the native test suite is skipped."
            echo "**AVX-512 IFMA unavailable** on this runner; the native test" \
              "suite was **skipped** and only compilation was checked." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Target features affect the whole crate, so run the complete library suite.
      - name: Test natively with AVX-512 target features
        if: steps.avx512-host.outputs.supported == 'true'
        run: |
          env -u CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER \
            cargo test -p solana-ed25519 --target "${AVX512_TARGET}" \
              --features avx512 --lib

      # Do not silently lose native AVX-512 coverage on the default branch.
      - name: Require AVX-512 coverage on the default branch
        if: >-
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && steps.avx512-host.outputs.supported != 'true'
        run: |
          echo "::error::No AVX-512 IFMA runner was available, so the native" \
            "test suite never ran on the default branch."
          exit 1

      # `--all-targets` also catches breakage in eligible cfg-gated test and
      # bench code.
      #
      # No `-D warnings` yet: enabling these target features also changes which
      # cfg branches of the pre-existing AVX2/packed_simd code compile, and that
      # configuration has never been linted — it is already warning-dirty on
      # upstream master, independently of the avx512 code. Clean that up in its
      # own change, then add `-- -D warnings` here.
      - name: Lint
        run: |
          cargo clippy -p solana-ed25519 --target "$AVX512_TARGET" \
            --features avx512 --all-targets

      # Ensure the AVX-512 target remains independent of unrelated default
      # features, especially `precomputed-tables`.
      - name: Build minimal feature set
        run: |
          cargo build -p solana-ed25519 --target "$AVX512_TARGET" \
            --no-default-features --features avx512 --lib

      # The AVX-512 target features must also compile when the curve backend is
      # forced to serial; the two selections are independent.
      - name: Build with serial curve backend
        run: |
          RUSTFLAGS="${RUSTFLAGS} --cfg curve25519_backend=\"serial\"" \
            cargo build -p solana-ed25519 --target "$AVX512_TARGET" \
              --features avx512 --all-targets
